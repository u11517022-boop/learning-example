<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 要求 1：分頁名稱改為「放學後社團體驗表」 -->
    <title>放學後社團體驗表</title>
</head>
<body>

    <!-- 要求 1：整頁 h1 改為「放學後社團體驗表」，並保留練習說明 -->
    <h1>放學後社團體驗表</h1>
    <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>

    <form>
        <!-- 要求 2 & 要求 8：暱稱使用單行文字欄位，label 與 id/for 對應，並指定提示文字 -->
        <p>
            <label for="nickname">我的暱稱</label><br>
            <input type="text" id="nickname" name="nickname" placeholder="提示：例如小星星">
        </p>

        <!-- 要求 3 & 要求 8：社團使用下拉選單，包含提示與三個項目，且有不同的 value -->
        <p>
            <label for="club">想體驗的社團</label><br>
            <select id="club" name="club">
                <option value="" disabled selected>請選擇社團</option>
                <option value="theater">故事劇場</option>
                <option value="science">科學手作</option>
                <option value="boardgame">桌遊挑戰</option>
            </select>
        </p>

        <!-- 要求 4 & 要求 5 & 要求 8：日期使用相同 name 互斥單選，並用 fieldset、legend 分組 -->
        <fieldset>
            <legend>方便參加的日子</legend>
            <p>
                <label><input type="radio" name="date_U11517022" value="tuesday"> 星期二</label><br>
                <label><input type="radio" name="date_U11517022" value="thursday"> 星期四</label><br>
                <label><input type="radio" name="date_U11517022" value="friday"> 星期五</label>
            </p>
        </fieldset>

        <br>

        <!-- 要求 5 & 要求 8：活動方式使用複選方塊，用 fieldset、legend 分組 -->
        <fieldset>
            <legend>我期待的活動方式</legend>
            <p>
                <label><input type="checkbox" name="skills_U11517022" value="craft"> 動手製作</label><br>
                <label><input type="checkbox" name="skills_U11517022" value="teamwork"> 和同學合作</label><br>
                <label><input type="checkbox" name="skills_U11517022" value="sharing"> 上台分享</label>
            </p>
        </fieldset>

        <br>

        <!-- 要求 6 & 要求 8：留言區使用五行高的 textarea，具備指定提示文字與 id/for 對應 -->
        <p>
            <label for="message">想告訴老師的事</label><br>
            <textarea id="message" name="message" rows="5" cols="35" placeholder="提示：例如我想和同學一起完成一個小作品"></textarea>
        </p>

        <!-- 要求 7：自訂一個有用的欄位（餐點習慣調查），並在旁邊用 p 說明理由 -->
        <p>
            <label for="meal">餐點習慣（自訂欄位）</label><br>
            <select id="meal" name="meal">
                <option value="" disabled selected>請選擇餐點需求</option>
                <option value="meat">葷食</option>
                <option value="vege">素食</option>
                <option value="self">自備點心</option>
            </select>
        </p>
        <!-- 要求 7：在旁邊/下方用 p 標籤說明為什麼選用這種元件 -->
        <p style="color: #555; font-size: 0.9em;">
            <strong>元件選擇理由：</strong>由於放學後社團常跨越點心或午餐時間，因此設計此欄位。選用「下拉選單」能防止學生隨意輸入無效文字，確保資料整齊，且比單選按鈕更省畫面空間。
        </p>

        <br>

        <!-- 要求 9：按鈕使用 type="button" 且設定 disabled，文字嚴格符合規定 -->
        <p>
            <button type="button" disabled>練習版，尚未開放報名</button>
        </p>
    </form>

</body>
</html>
