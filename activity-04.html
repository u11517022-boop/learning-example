<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>活動 04｜表單元件</title><style>
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;line-height:1.8;padding:30px}main{max-width:800px;margin:auto}.back{color:#38bdf8;text-decoration:none}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:30px;margin-top:25px}h1,h2{color:#fff}h1{margin:15px 0}h2{border-left:4px solid #38bdf8;padding-left:10px;margin-top:25px}label{display:block;margin-top:15px}input,select,textarea{display:block;width:100%;margin-top:5px;padding:9px;border-radius:6px;border:1px solid #64748b}fieldset{margin-top:15px;padding:15px;border:1px solid #64748b}fieldset label{display:inline-block;margin-right:20px}button{margin-top:20px;padding:10px 15px;border:0;border-radius:6px}.note{color:#94a3b8}</style></head><body><main><a class="back" href="digital-technology-homework.html">← 回到活動列表</a><div class="card"><p>HTML 活動 04</p><h1>週末創作體驗報名表</h1><p class="note">練習表單元件、label 關聯與單選／複選操作。</p><form><label for="nickname">暱稱</label><input id="nickname" name="nickname" type="text"><label for="club">想參加的社團</label><select id="club" name="club"><option>攝影社</option><option>程式設計社</option><option>創意設計社</option></select><fieldset><legend>活動日期</legend><label><input type="radio" name="day" value="tue"> 星期二</label><label><input type="radio" name="day" value="thu"> 星期四</label></fieldset><fieldset><legend>活動方式</legend><label><input type="checkbox" name="method" value="online"> 線上</label><label><input type="checkbox" name="method" value="onsite"> 實體</label></fieldset><label for="message">留言</label><textarea id="message" name="message" rows="5" placeholder="請輸入你的想法"></textarea><p class="note">新增欄位可依自己的想法設計，並說明為什麼選擇這種表單元件。</p><button type="button" disabled>練習版，尚未開放報名</button></form><h2>作業檔名</h2><p>04-html-form-學號.html</p></div></main></body></html>
