<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>03-html-plan-U11517022</title>
    <!-- 保留老師提供的 CSS 框線與基本樣式 -->
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        h2 { color: #2c3e50; margin-top: 20px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 30px; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        caption { font-weight: bold; margin-bottom: 5px; text-align: left; }
    </style>
</head>
<body>

    <h1>紙橋挑戰社：活動準備頁</h1> 
    <p>我們要用簡單的材料，設計一座能承重的紙橋。</p> 

    <h2>要帶的材料</h2> 
    <ul> 
        <li>A4 紙 3 張</li>
        <li>膠帶 1 卷</li>
        <li>積木 10 個</li>
    </ul>

    <h2>挑戰步驟</h2> 
    <ol> 
        <li>先畫出紙橋草圖</li>
        <li>再折出橋面並固定</li>
        <li>逐一放上積木，觀察能承受的重量</li>
        <li>記錄結果，討論如何改進</li>
    </ol>

    <h2>小組分工</h2> 
    <table> 
        <caption>小組任務分工表</caption> 
        <thead>
            <tr>
                <th scope="col">角色</th>
                <th scope="col">負責工作</th>
                <th scope="col">預計成果</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>設計員</td>
                <td>畫出紙橋草圖</td>
                <td>一張草圖</td>
            </tr>
            <tr>
                <td>製作員</td>
                <td>依照草圖組裝</td>
                <td>一座紙橋</td>
            </tr>
            <tr>
                <td>紀錄員</td>
                <td>記錄測試結果</td>
                <td>一份測試紀錄</td>
            </tr>
            <tr>
                <td>報告員</td>
                <td>向全班發表並分享心得</td>
                <td>一份簡報檔案</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
