    <h1>把小站變成我的｜文字層級</h1>

    <p>練習內容角色判斷與 HTML 文字標籤。</p>

    <h2>學習重點</h2>

    <ul>
        <li>使用一個 h1 作為整頁主要標題。</li>
        <li>使用兩個 h2 區分主要小主題。</li>
        <li>「活動介紹」之下使用兩個 h3。</li>
        <li>一般敘述使用 p，不把所有文字都做成標題。</li>
        <li>自備水壺使用粗體，口號使用斜體。</li>
        <li>H<sub>2</sub>O 使用下標，cm<sup>2</sup> 使用上標。</li>
    </ul>
